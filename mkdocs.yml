site_name: Rubrik Developer Center
site_url: https://developer.rubrik.com
copyright: Copyright &copy; 2025 Rubrik, Inc.
exclude_docs: |
  Rubrik-Security-Cloud-API/schemas/
# Broken internal links and anchors are surfaced here and turned into failures
# by `mkdocs build --strict` in CI. These are the 404s a reader actually hits,
# and mkdocs resolves every internal link at build time, so catching them costs
# nothing.
#
# omitted_files stays ignored on purpose: the ~10k generated reference pages are
# deliberately absent from the nav (see not_in_nav) and would otherwise produce
# ten thousand warnings.
validation:
  omitted_files: ignore
  absolute_links: warn
  unrecognized_links: warn
  links:
    not_found: warn
    anchors: warn

# The generated reference subtrees are built and linkable but deliberately kept
# out of the nav. Material renders a page's siblings into every page, and
# types/objects alone holds ~3,900 of them, which made each reference page ~1.4MB
# and the whole site 9.8GB against GitHub Pages' 10GB ceiling. Excluding them
# takes the build to ~430MB.
#
# Note these pages are ALSO excluded from search (see the exclude-search plugin
# below), so the alphabetical indexes at API-Reference/{queries,mutations,types}
# and cross-links from the guides are the only way in. Keep those indexes
# working. API-Reference/index.md, Changelog, and Deprecations stay in the nav.
not_in_nav: |
  Rubrik-Security-Cloud-API/API-Reference/queries/
  Rubrik-Security-Cloud-API/API-Reference/mutations/
  Rubrik-Security-Cloud-API/API-Reference/types/
theme:
  name: material
  logo: assets/favicon.ico
  favicon: assets/favicon.ico
  custom_dir: overrides
  font:
    text: Source Sans 3
    code: Fira Code
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    annotation: material/arrow-right-circle
  features:
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.tabs.link
    - navigation.tabs
    - navigation.indexes
    - navigation.prune
#    - navigation.sections
    - search.share
extra_css:
  - css/extra.css
extra_javascript:
  - javascripts/extra.js
  - javascripts/schema-search.js
extra:
  status:
    beta: Beta
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    cookies:
      analytics: Site usage statistics (Mixpanel)
  generator: true  
  analytics:
    provider: mixpanel
    # Project token here is NOT a secret. It's used to identify the project in Mixpanel and is write only
    project_token: 9949d865e3afe70668e198cc55b31299
  static_templates:
    - 404.html
markdown_extensions:
  - abbr
  - admonition
  # Required for the `???` collapsible blocks the changelog generator emits.
  # Without it they render as literal text followed by a code block.
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      url_download: true
      base_path: .
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
plugins:
  - material/search:
  - exclude-search:
      exclude:
        - Rubrik-Security-Cloud-API/API-Reference/**
  - awesome-pages
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Rubrik Security Cloud API:
        - Rubrik-Security-Cloud-API/*.md
        SDKs and Tools:
        - SDKs-and-Tools/*.md
        Integrations:
        - Integrations/*.md
  - git-revision-date-localized:
      type: iso_date
      exclude:
        - Rubrik-Security-Cloud-API/API-Reference/**
hooks:
  - hooks/generate_llms_txt.py
watch:
  - code
  - overrides
