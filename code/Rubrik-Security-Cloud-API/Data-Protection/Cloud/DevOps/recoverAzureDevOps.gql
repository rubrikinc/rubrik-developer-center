mutation {
  recoverDevOpsRepository(
    input: {
      repositoryId: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
      snapshotId: "11111111-2222-3333-4444-555555555555"
      repoType: AZURE_DEVOPS
      orgId: "99999999-8888-7777-6666-555555555555" # destination Azure DevOps organization
      repositoryName: "recovered-repo"
      includePipelines: true
      devopsTypeRestoreConfig: {
        azureDevopsRecoveryConfig: {
          # Always required when the destination is Azure DevOps.
          projectId: "33333333-4444-5555-6666-777777777777"
        }
      }
    }
  ) {
    taskchainId
    errorMessage
  }
}
