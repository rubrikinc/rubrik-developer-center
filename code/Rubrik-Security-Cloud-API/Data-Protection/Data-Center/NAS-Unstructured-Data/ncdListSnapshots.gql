# workloadId is the share FID passed as a String (not a UUID scalar).
query {
  snapshotsOfCloudDirectShare(
    workloadId: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
    sortBy: CREATION_TIME
    sortOrder: DESC
  ) {
    nodes {
      id
      date
      expirationDate
      protocol
      isIndexed
      isQuarantined
      isExpired
      isOnDemandSnapshot
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
