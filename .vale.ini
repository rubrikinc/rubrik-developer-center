StylesPath = styles

[*.md]
BasedOnStyles = write-good, proselint, Microsoft

# E-Prime flags every form of the verb "to be". It comes from general semantics,
# where the point is to expose subjective judgments dressed as fact, not from
# any technical-writing convention. API docs state specifications, and "iops is
# required" is exactly right. It was 676 of 3,032 findings.
write-good.E-Prime = NO

# Passive voice is flagged by both write-good and Microsoft, identically and on
# the same lines. Keeping Microsoft's, which is the style we otherwise follow.
write-good.Passive = NO
