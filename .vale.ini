StylesPath = styles

[*.md]
# Microsoft only. It accounted for 1,936 of 2,069 findings when write-good and
# proselint were also enabled, and the other two mostly fought our vocabulary:
# write-good.TooWordy flagged "monitor" 26 times (a product concept here) and
# "point in time" 10 times (precise API terminology). Microsoft.Wordiness covers
# the genuine cases. proselint contributed two findings, both "Very".
#
# The styles/write-good and styles/proselint packages stay in the repo so this
# can be reversed without re-downloading anything.
BasedOnStyles = Microsoft
